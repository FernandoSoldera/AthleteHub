spring.application.name=athletehub

# Import .env as properties (optional - won't fail if missing)
spring.config.import=optional:file:.env[.properties]

# Server
server.port=${SERVER_PORT:8080}

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:athletehub}
spring.datasource.username=${DB_USER:athletehub_user}
spring.datasource.password=${DB_PASSWORD:athletehub_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA (schema is owned by Flyway, never by Hibernate)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.clean-disabled=${FLYWAY_CLEAN_DISABLED:true}

# JWT (consumed from EPIC 1)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-64-characters-long-for-hs512-algorithm-x}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}

# Email / SMTP (consumed from EPIC 1: activation + password reset)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}

# Async pool
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100

# Actuator (expose only health by default)
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health}
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
# The SMTP health indicator would mark /health DOWN without a reachable mail
# server; we don't gate liveness on email, so disable that contributor.
management.health.mail.enabled=false

# Logging
logging.level.com.example.athletehub=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
logging.level.org.flywaydb=${LOG_LEVEL_FLYWAY:INFO}

# CORS: comma-separated allowed origins (empty blocks browser cross-origin)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Multipart (progress photos arrive from EPIC 9)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# NOTE: OAuth2 social-login registrations (Google/Apple) are added in EPIC 1 (AH-015);
# Firebase service-account config is added in EPIC 9 (AH-090).
