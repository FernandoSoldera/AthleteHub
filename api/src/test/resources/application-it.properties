# Integration-test profile. Datasource is injected by AbstractIntegrationTest
# via @DynamicPropertySource (Testcontainers PostgreSQL); Flyway runs against it.

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none

# Health: expose details so the smoke test can read status; the SMTP indicator
# is disabled (no real mail server in tests).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.mail.enabled=false
